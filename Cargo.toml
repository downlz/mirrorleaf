[workspace]
resolver = "3"
members = ["crates/*", "ledger", "apps/mirrorleaf/src-tauri", "vendor/ndk-context"]

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

# Versions are taken only from releases at least 7 days old (ADR-001). Iroh and
# yrs are pinned exactly: Iroh may still change during 1.x, and yrs must stay in
# step with Yjs in the editor (plan §9).
[workspace.dependencies]
mirrorleaf-core = { path = "crates/core" }
mirrorleaf-ffi = { path = "crates/ffi" }
mirrorleaf-net = { path = "crates/net" }
mirrorleaf-proto = { path = "crates/proto" }

anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
core-foundation = "0.10.1"
data-encoding = "2.11.1"
ed25519-dalek = "3.0.0"
# JPEG, PNG and WebP are decoded in Rust; HEIC needs the platform's decoder (plan §5.5).
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
# Android only: the app's startup code hands the JVM and the application context
# to Iroh's network code and to HTTPS certificate checks (ADR-005).
jni = "0.22.4"
ndk-context = "0.1.1"
rustls-platform-verifier = "0.7.1"
iroh = "=1.4.1"
# Pre-1.0, so pinned exactly. 0.104.0 was under 7 days old at M2 (ADR-003).
iroh-blobs = { version = "=0.103.1", default-features = false, features = ["fs-store"] }
# Iroh's own futures helpers (already in the tree through Iroh), for iroh-blobs' progress streams.
n0-future = "0.3.2"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
rand = "0.10.3"
# HTTPS to the ledger and to FCM, through the rustls and ring Iroh already uses.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# sqlx's Postgres crates rather than the `sqlx` facade: the facade's optional
# SQLite driver needs an older libsqlite3-sys than rusqlite, and Cargo refuses
# two crates linking SQLite even when the driver is switched off (ADR-004).
sqlx-core = { version = "=0.9.0", default-features = false, features = ["_rt-tokio", "_tls-rustls-ring-webpki", "json"] }
sqlx-postgres = { version = "=0.9.0", default-features = false, features = ["json"] }
# Tauri 2 (Tauri 3 is still in alpha). Its Android template's Gradle versions are
# kept as generated (owner's decision, 4 Nov 2026).
tauri = "2.12.5"
tauri-build = "2.7.4"
# Desktop agent (M5): one instance, and starting at login. Both from Tauri's
# plugins workspace; Apache-2.0 OR MIT.
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-single-instance = "=2.5.4"
# macOS sleep and wake notifications for the desktop agent (M5). Already in the
# tree through Tauri's window code; only features are added.
block2 = "0.6.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSNotification", "NSOperation", "NSString"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# Pinned exactly: the generated Kotlin and the Rust scaffolding must come from the
# same release (ADR-005). Features are added per crate.
uniffi = { version = "=0.32.2", default-features = false }
uuid = { version = "1.29.0", features = ["v7"] }
yrs = "=0.28.0"

# ADR-005 (owner's decision, 4 Nov 2026): a patched ndk-context that allows a
# second initialisation, so a push-woken job and Tauri's screen can both set
# Android's context in one process. See vendor/ndk-context/Cargo.toml.
[patch.crates-io]
ndk-context = { path = "vendor/ndk-context" }

# Implementation plan §3.3: no debug info for dependencies keeps debug builds
# smaller and lighter on the 8 GB Mac.
[profile.dev.package."*"]
debug = false

# Photo decoding, resizing and hashing are many times slower unoptimised, which
# makes the 12 MP photo tests crawl (M2).
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3
[profile.dev.package.blake3]
opt-level = 3

# Release builds run in CI (plan §3.3), so they can afford a slow, thorough optimise.
[profile.release]
lto = true
codegen-units = 1
strip = true
