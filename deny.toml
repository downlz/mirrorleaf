# cargo-deny: dependency guards for the Rust workspace (implementation plan, M0).
# Run locally with `cargo deny check`; CI runs it on every push.

[advisories]
# Defaults: known vulnerabilities fail the check.
ignore = []

[licenses]
# Permissive licences plus MPL-2.0 (uniffi). Mirrorleaf's own licence isn't chosen
# yet, so no GPL-family licence is allowed: it would narrow that choice.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
# Our own crates are `publish = false` and have no licence yet.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
