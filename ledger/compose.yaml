# The ledger and its Postgres (implementation plan §3.4, M3; HTTPS and limits
# from E0). From this folder: `docker compose up -d --build`, which publishes
# the ledger on this machine only (127.0.0.1:8080). Add `--profile https` to
# put Caddy in front of it with HTTPS on ports 80 and 443.
# Settings come from `.env` in this folder; see `env.example`.
name: mirrorleaf-ledger

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ledger
    volumes:
      # From postgres:18 the image keeps its data under /var/lib/postgresql
      # (17 and earlier used /var/lib/postgresql/data). A volume made by
      # another major version can't be opened: remove it with
      # `docker compose down -v`, and devices register again on their next
      # report (ADR-004).
      - db:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ledger']
      interval: 5s
      timeout: 3s
      retries: 10

  ledger:
    build:
      context: ..
      dockerfile: ledger/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/ledger
      FCM_SERVICE_ACCOUNT: ${FCM_SERVICE_ACCOUNT:-}
      LEDGER_DEVICE_REQUESTS_PER_MINUTE: ${LEDGER_DEVICE_REQUESTS_PER_MINUTE:-}
      LEDGER_NEW_ACCOUNTS_PER_MINUTE: ${LEDGER_NEW_ACCOUNTS_PER_MINUTE:-}
      RUST_LOG: info,sqlx=warn
    volumes:
      # The Firebase service-account key, when there is one. Never committed.
      - ./secrets:/secrets:ro
    ports:
      # This machine only by default. For a phone on the same Wi-Fi during
      # development, set LEDGER_PUBLISH=8080 in `.env` (every interface).
      - '${LEDGER_PUBLISH:-127.0.0.1:8080}:8080'
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'

  # HTTPS in front of the ledger (E0), only with `--profile https`. Caddy gets
  # and renews the certificate for LEDGER_DOMAIN itself; with `localhost` it
  # uses its own local certificate authority instead.
  caddy:
    image: caddy:2.11.7
    profiles: [https]
    restart: unless-stopped
    depends_on:
      - ledger
    environment:
      LEDGER_DOMAIN: ${LEDGER_DOMAIN:-localhost}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'

volumes:
  db:
  caddy-data:
  caddy-config:
