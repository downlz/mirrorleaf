# The Windows app (owner, 15 Nov 2026): installers for Windows 11 on x64 and on
# ARM, unsigned for the beta, built on GitHub's Windows machines. Runs on pushes
# to main and to `windows/...` branches, on pull requests, and by hand (Actions
# → Windows → Run workflow).
name: Windows

on:
  push:
    branches: [main, 'windows/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Rust checks and tests on Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (the Windows code, the engine and the app)
        run: cargo clippy --locked -p mirrorleaf-windows -p mirrorleaf-core -p mirrorleaf-net -p mirrorleaf-ffi -p mirrorleaf-app --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked -p mirrorleaf-windows -p mirrorleaf-proto -p mirrorleaf-core -p mirrorleaf-net

  app:
    name: Windows app (${{ matrix.arch }}, unsigned)
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # SQLCipher's OpenSSL is built from source and needs a full Perl.
      - name: Perl for OpenSSL
        shell: pwsh
        run: |
          $ok = $false
          if (Get-Command perl -ErrorAction SilentlyContinue) {
            perl -MLocale::Maketext::Simple -e 1 2>$null
            $ok = ($LASTEXITCODE -eq 0)
          }
          if (-not $ok) {
            choco install strawberryperl --no-progress -y
            "C:\Strawberry\perl\bin" >> $env:GITHUB_PATH
          }
          $global:LASTEXITCODE = 0
      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version 2.12.4 --locked
      - name: Build the app and installer
        working-directory: apps/mirrorleaf/src-tauri
        env:
          MIRRORLEAF_DEFAULT_LEDGER: https://ledger.mirrorleaf.app
        run: cargo tauri build --target ${{ matrix.target }} --bundles nsis --ci
      - name: Installer size (gate ≤ 25 MB)
        shell: pwsh
        run: |
          $exe = Get-ChildItem "target/${{ matrix.target }}/release/bundle/nsis/*.exe" | Select-Object -First 1
          $kb = [math]::Round($exe.Length / 1KB)
          Write-Output "Installer: $($exe.Name), $kb KB"
          "### Windows ${{ matrix.arch }} installer: $kb KB (gate 25 MB)" >> $env:GITHUB_STEP_SUMMARY
          if ($exe.Length -gt 25MB) { exit 1 }
      - uses: actions/upload-artifact@v7
        with:
          name: mirrorleaf-windows-${{ matrix.arch }}-unsigned
          path: target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
