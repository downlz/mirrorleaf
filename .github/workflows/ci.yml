# CI for Phase 0 (implementation plan, M0–M2). The Android build joins in M4,
# and the macOS app build and the compile-only Windows check in M5.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (format, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # M2: HEIC photos are decoded with macOS ImageIO, which builds and runs only
  # on macOS.
  rust-macos:
    name: Rust on macOS (core clippy and tests)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p mirrorleaf-core --all-targets --locked -- -D warnings
      - run: cargo test -p mirrorleaf-core --locked

  # M1: release builds of the headless peer, so other machines (the Ubuntu
  # helper) can run it without building. Download them from the run's page.
  cli:
    name: CLI binary (${{ matrix.target }})
    needs: rust
    strategy:
      matrix:
        include:
          # 24.04 rather than ubuntu-latest: the binary then runs on Ubuntu 24.04 and newer.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p mirrorleaf-cli
      - uses: actions/upload-artifact@v7
        with:
          name: mirrorleaf-cli-${{ matrix.target }}
          path: target/release/mirrorleaf-cli
          if-no-files-found: error

  rust-deps:
    name: Rust dependencies (licences, advisories, duplicates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  web:
    name: TypeScript (lint, format, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the pnpm version pinned in package.json's packageManager field.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm -r typecheck
      - run: pnpm -r test
