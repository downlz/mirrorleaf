# CI for Phase 0 (implementation plan, M0–M5).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (format, clippy, tests)
    runs-on: ubuntu-latest
    # M3: the ledger's database tests run against this Postgres.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s
          --health-retries 10
    env:
      MIRRORLEAF_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # The Tauri app is built in the Android job (M4) and the macOS job (M5);
      # on Linux it would need the WebKitGTK libraries for nothing.
      - run: cargo clippy --workspace --exclude mirrorleaf-app --all-targets --locked -- -D warnings
      - run: cargo test --workspace --exclude mirrorleaf-app --locked

  # M2: HEIC photos are decoded with macOS ImageIO, which builds and runs only
  # on macOS.
  rust-macos:
    name: Rust on macOS (core clippy and tests)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p mirrorleaf-core --all-targets --locked -- -D warnings
      - run: cargo test -p mirrorleaf-core --locked

  # M1: release builds of the headless peer, so other machines (the Ubuntu
  # helper) can run it without building. Download them from the run's page.
  cli:
    name: CLI binary (${{ matrix.target }})
    needs: rust
    strategy:
      matrix:
        include:
          # 24.04 rather than ubuntu-latest: the binary then runs on Ubuntu 24.04 and newer.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          # ARM Linux (a Raspberry Pi, an ARM mini-PC or cloud server as an
          # extra peer), built natively on GitHub's ARM runner; 24.04 as above.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p mirrorleaf-cli
      - uses: actions/upload-artifact@v7
        with:
          name: mirrorleaf-cli-${{ matrix.target }}
          path: target/release/mirrorleaf-cli
          if-no-files-found: error

  rust-deps:
    name: Rust dependencies (licences, advisories, duplicates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  web:
    name: TypeScript (lint, format, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the pnpm version pinned in package.json's packageManager field.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm -r typecheck
      - run: pnpm -r test
      # M5: the screen's bundle, as the app build makes it.
      - run: pnpm --filter @mirrorleaf/app build

  # M4: the Android app for arm64, with the engine and the Kotlin background
  # code (ADR-005). Release builds for every CPU type are `android-release`.
  android:
    name: Android app (arm64 debug APK)
    runs-on: ubuntu-24.04
    env:
      # The runner has several NDKs; use the one the Mac uses (ADR-005).
      NDK_HOME: /usr/local/lib/android/sdk/ndk/29.0.14206865
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: gradle/actions/setup-gradle@v6
      # M5: the app's build step bundles the screen with Vite.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version 2.12.4 --locked
      # The real google-services.json is a secret; without it, a placeholder.
      - name: Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: .github/scripts/google-services.sh
      - name: Clippy for Android (engine startup code and app)
        run: |
          tc=$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          export CC_aarch64_linux_android=$tc/aarch64-linux-android24-clang
          export AR_aarch64_linux_android=$tc/llvm-ar
          cargo clippy --locked --target aarch64-linux-android -p mirrorleaf-ffi -p mirrorleaf-app -- -D warnings
      - name: Build the APK
        working-directory: apps/mirrorleaf/src-tauri
        run: cargo tauri android build --debug --target aarch64 --apk --ci
      - uses: actions/upload-artifact@v7
        with:
          name: mirrorleaf-android-arm64-debug
          path: apps/mirrorleaf/src-tauri/gen/android/app/build/outputs/apk/universal/debug/*.apk
          if-no-files-found: error

  # M7: release APKs, one per CPU type, with the download size gate (plan §7.3:
  # ≤ 25 MB per CPU type). Unsigned: signing comes with the store release (E13).
  android-release:
    name: Android release APK (${{ matrix.target }}) and size check
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64
            rust: aarch64-linux-android
          - target: armv7
            rust: armv7-linux-androideabi
          - target: x86_64
            rust: x86_64-linux-android
    env:
      NDK_HOME: /usr/local/lib/android/sdk/ndk/29.0.14206865
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-release-${{ matrix.target }}
      - uses: gradle/actions/setup-gradle@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version 2.12.4 --locked
      - name: Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: .github/scripts/google-services.sh
      # The bindings step needs the library's symbols (gen/android's BuildTask.kt sets the
      # same for its own cargo run); packaging strips the library afterwards.
      - name: Build the APK
        working-directory: apps/mirrorleaf/src-tauri
        env:
          CARGO_PROFILE_RELEASE_STRIP: debuginfo
        run: cargo tauri android build --target ${{ matrix.target }} --apk --split-per-abi --ci
      # The APK stores the native library uncompressed (Android maps it straight from
      # the APK), so the file is about twice what a store download sends (estimated
      # as the APK compressed with gzip -9). Owner, 6 Nov 2026: size isn't a hard
      # gate while both stay within 30–40 MB, so CI fails only above 40 MB.
      - name: APK and download size (limit 40 MB each)
        run: |
          apk=$(find apps/mirrorleaf/src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -n 1)
          test -n "$apk"
          size=$(stat -c %s "$apk")
          download=$(gzip -9 -c "$apk" | wc -c)
          echo "APK: $apk, $size bytes; compressed (download estimate): $download bytes"
          unzip -lv "$apk" | sort -k1 -n -r | head -n 12
          echo "### Android ${{ matrix.target }}: APK file $((size / 1024)) KB, download about $((download / 1024)) KB (limit 40 MB each)" >> "$GITHUB_STEP_SUMMARY"
          test "$size" -le $((40 * 1024 * 1024))
          test "$download" -le $((40 * 1024 * 1024))
      - uses: actions/upload-artifact@v7
        with:
          name: mirrorleaf-android-${{ matrix.target }}-release-unsigned
          path: apps/mirrorleaf/src-tauri/gen/android/app/build/outputs/apk/**/release/*.apk
          if-no-files-found: error

  # M5: the macOS app for Apple silicon, unsigned (signing and notarising are
  # E13), with the installer size gate (plan §7.3: ≤ 25 MB).
  desktop-macos:
    name: macOS app (Apple silicon, unsigned) and size check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version 2.12.4 --locked
      - run: cargo clippy --locked -p mirrorleaf-app -- -D warnings
      - name: Build the app and installer
        working-directory: apps/mirrorleaf/src-tauri
        run: cargo tauri build --bundles app,dmg --ci
      - name: Installer size (gate ≤ 25 MB)
        run: |
          dmg=$(ls target/release/bundle/dmg/*.dmg)
          app=target/release/bundle/macos/Mirrorleaf.app
          size=$(stat -f %z "$dmg")
          echo "Installer: $dmg, $size bytes"
          echo "App: $(du -sk "$app" | cut -f1) KB"
          ls -l "$app/Contents/MacOS"
          echo "### macOS installer: $((size / 1024)) KB (gate 25 MB)" >> "$GITHUB_STEP_SUMMARY"
          test "$size" -le $((25 * 1024 * 1024))
      - uses: actions/upload-artifact@v7
        with:
          name: mirrorleaf-macos-arm64-unsigned
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # M5: the desktop app on Linux, as the second desktop peer on the Ubuntu
  # machine (M5's "done when"). Not a release target.
  desktop-linux:
    name: Linux app (x86_64 .deb)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: WebKitGTK and tray libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version 2.12.4 --locked
      - run: cargo clippy --locked -p mirrorleaf-app -- -D warnings
      - name: Build the .deb
        working-directory: apps/mirrorleaf/src-tauri
        run: cargo tauri build --bundles deb --ci
      - uses: actions/upload-artifact@v7
        with:
          name: mirrorleaf-linux-x86_64-deb
          path: target/release/bundle/deb/*.deb
          if-no-files-found: error

  # M5: Windows is deferred (29 Oct 2026); this compile-only check keeps the
  # code building for when it returns (plan §9).
  windows-check:
    name: Windows compile check (deferred platform)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked -p mirrorleaf-app -p mirrorleaf-cli
