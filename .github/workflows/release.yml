# Releases. Push a version tag (git tag v0.5.0 && git push origin v0.5.0) and
# this builds every app from that tag and makes a DRAFT release on GitHub with
# the files, a download guide and the version's part of CHANGELOG.md. Nothing is
# public until the owner opens the draft and clicks Publish.
#
# The tag must match the version in tauri.conf.json, and CHANGELOG.md must have
# a "## <version>" section. The Android APK is included only when the release
# key is in the repository's secrets (ANDROID_KEYSTORE_BASE64,
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: An existing version tag, such as v0.5.0
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  # New devices made by these builds use Mirrorleaf's server.
  MIRRORLEAF_DEFAULT_LEDGER: https://ledger.mirrorleaf.app

jobs:
  prepare:
    name: Check the version and changelog
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - id: version
        name: The tag matches the app's version
        run: |
          version="${TAG#v}"
          app=$(jq -r .version apps/mirrorleaf/src-tauri/tauri.conf.json)
          if [ "$version" != "$app" ]; then
            echo "The tag says $version but tauri.conf.json says $app." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: This version's changelog
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            /^## / { found = (index($0, "## " v " ") == 1 || $0 == "## " v); if (!found && printed) exit; next }
            found { print; printed = 1 }
          ' CHANGELOG.md > changes.md
          if ! grep -q '[^[:space:]]' changes.md; then
            echo "CHANGELOG.md has no \"## $version\" section." >&2
            exit 1
          fi
          cat changes.md
      - uses: actions/upload-artifact@v7
        with:
          name: changes
          path: changes.md

  macos:
    name: Mac (Apple silicon)
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo install tauri-cli --version 2.12.4 --locked
      - name: Build
        working-directory: apps/mirrorleaf/src-tauri
        # "-" signs ad hoc (no certificate). Without it the app has only the
        # linker's signature, with nothing sealing the bundle, and macOS calls
        # a downloaded copy "damaged" instead of offering Open Anyway.
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: cargo tauri build --bundles dmg --ci
      - name: Name the file
        run: |
          mkdir out
          cp target/release/bundle/dmg/*.dmg "out/Mirrorleaf-${{ needs.prepare.outputs.version }}-mac-apple-silicon.dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: out/*

  windows:
    name: Windows (${{ matrix.arch }})
    needs: prepare
    strategy:
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Perl for OpenSSL
        shell: pwsh
        run: |
          $ok = $false
          if (Get-Command perl -ErrorAction SilentlyContinue) {
            perl -MLocale::Maketext::Simple -e 1 2>$null
            $ok = ($LASTEXITCODE -eq 0)
          }
          if (-not $ok) {
            choco install strawberryperl --no-progress -y
            "C:\Strawberry\perl\bin" >> $env:GITHUB_PATH
          }
          $global:LASTEXITCODE = 0
      - run: cargo install tauri-cli --version 2.12.4 --locked
      - name: Build
        working-directory: apps/mirrorleaf/src-tauri
        run: cargo tauri build --target ${{ matrix.target }} --bundles nsis --ci
      - name: Name the file
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          $exe = Get-ChildItem "target/${{ matrix.target }}/release/bundle/nsis/*.exe" | Select-Object -First 1
          Copy-Item $exe.FullName "out/Mirrorleaf-${{ needs.prepare.outputs.version }}-windows-${{ matrix.arch }}-setup.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows-${{ matrix.arch }}
          path: out/*

  linux:
    name: Linux (.deb)
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: WebKitGTK and tray libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo install tauri-cli --version 2.12.4 --locked
      - name: Build
        working-directory: apps/mirrorleaf/src-tauri
        run: cargo tauri build --bundles deb --ci
      - name: Name the file
        run: |
          mkdir out
          cp target/release/bundle/deb/*.deb "out/Mirrorleaf-${{ needs.prepare.outputs.version }}-linux-amd64.deb"
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: out/*

  android:
    name: Android (arm64)
    needs: prepare
    runs-on: ubuntu-24.04
    env:
      NDK_HOME: /usr/local/lib/android/sdk/ndk/29.0.14206865
    steps:
      - id: key
        name: Is the release key set up?
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "### No Android release key in the secrets: the release has no APK." >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.key.outputs.ready == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - if: steps.key.outputs.ready == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - if: steps.key.outputs.ready == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - if: steps.key.outputs.ready == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          key: android-release-aarch64
      - if: steps.key.outputs.ready == 'true'
        uses: gradle/actions/setup-gradle@v6
      - if: steps.key.outputs.ready == 'true'
        uses: pnpm/action-setup@v6
      - if: steps.key.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.key.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.key.outputs.ready == 'true'
        run: cargo install tauri-cli --version 2.12.4 --locked
      - if: steps.key.outputs.ready == 'true'
        name: Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: .github/scripts/google-services.sh
      - if: steps.key.outputs.ready == 'true'
        name: Build
        working-directory: apps/mirrorleaf/src-tauri
        env:
          CARGO_PROFILE_RELEASE_STRIP: debuginfo
        run: cargo tauri android build --target aarch64 --apk --split-per-abi --ci
      - if: steps.key.outputs.ready == 'true'
        name: Sign and name the file
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          apk=$(find apps/mirrorleaf/src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -n 1)
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          mkdir out
          # No v4 signature: it only speeds up `adb install` and comes as a
          # separate .idsig file that would end up on the release page.
          "$tools/apksigner" sign --v4-signing-enabled false --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --out "out/Mirrorleaf-${{ needs.prepare.outputs.version }}-android.apk" "$apk"
          rm -f "$RUNNER_TEMP/release.jks"
          "$tools/apksigner" verify "out/Mirrorleaf-${{ needs.prepare.outputs.version }}-android.apk"
      - if: steps.key.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: out/*

  release:
    name: Draft the release
    needs: [prepare, macos, windows, linux, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: files
          merge-multiple: true
      - uses: actions/download-artifact@v7
        with:
          name: changes
      - name: Write the release notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cd files
          sha256sum * > SHA256SUMS.txt
          cd ..
          row() { [ -f "files/$2" ] && echo "| $1 | \`$2\` |"; return 0; }
          {
            cat changes.md
            echo
            echo "## Which file do I need?"
            echo
            echo "| Your device | File |"
            echo "|---|---|"
            row "Mac with Apple silicon (M1 or newer)" "Mirrorleaf-$VERSION-mac-apple-silicon.dmg"
            row "Windows PC" "Mirrorleaf-$VERSION-windows-x64-setup.exe"
            row "Windows on ARM (Snapdragon)" "Mirrorleaf-$VERSION-windows-arm64-setup.exe"
            row "Android phone or tablet" "Mirrorleaf-$VERSION-android.apk"
            row "Linux (Debian 13, Ubuntu 24.04 or newer)" "Mirrorleaf-$VERSION-linux-amd64.deb"
            echo
            echo "The apps aren't signed yet, so you'll see a warning the first time you open one:"
            echo
            echo "- **Mac:** open the app once, then go to System Settings > Privacy & Security and click **Open Anyway**."
            echo "- **Windows:** click **More info**, then **Run anyway**."
            echo "- **Android:** allow your browser or file manager to install apps when it asks."
          } > notes.md
          cat notes.md
      - name: Make or update the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        # A rebuild of the same version replaces its unpublished draft (lookups
        # by tag don't see drafts, so they're found by listing). A published
        # release is never changed: a fix gets a new version.
        run: |
          releases=$(gh api "repos/$GH_REPO/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | \"\(.id) \(.draft)\"")
          if echo "$releases" | grep -q ' false$'; then
            echo "$TAG is already published. Give the fix a new version (such as 0.5.1)." >&2
            exit 1
          fi
          echo "$releases" | awk 'NF { print $1 }' | while read -r id; do
            echo "Replacing the earlier draft $id"
            gh api -X DELETE "repos/$GH_REPO/releases/$id"
          done
          gh release create "$TAG" files/* --draft --verify-tag \
            --title "Mirrorleaf $VERSION" --notes-file notes.md
